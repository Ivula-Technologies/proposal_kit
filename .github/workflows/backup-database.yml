name: Back up database

# Weekly encrypted copy of the Supabase database, kept as a downloadable
# workflow artifact for 90 days. Needs two repository secrets:
#   SUPABASE_DB_URL     Supabase > Project Settings > Database > Connection string
#                       (Session pooler, with your database password filled in)
#   BACKUP_PASSPHRASE   any long passphrase; keep a copy in your password manager
# Restore steps are in SYSTEM-DESIGN.md.

on:
  schedule:
    - cron: '17 3 * * 0' # Sundays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Add SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets to turn on backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d)
          # pg_dump 17 reads Supabase's Postgres 15 and 17 databases.
          docker run --rm -e DB_URL postgres:17 \
            pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --schema=auth \
            | gzip -9 > "proposalkit-$stamp.sql.gz"
          test -s "proposalkit-$stamp.sql.gz"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "proposalkit-$stamp.sql.gz.gpg" "proposalkit-$stamp.sql.gz"
          rm "proposalkit-$stamp.sql.gz"
          ls -lh proposalkit-*.gpg

      - name: Keep for 90 days
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proposalkit-db-backup
          path: proposalkit-*.sql.gz.gpg
          retention-days: 90
