<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1A3E">
<title>You're offline · ProposalKit</title>
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #F8FAFC; color: #1A1F2E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 20px 0 8px; color: #0F1A3E; }
  p { margin: 0 0 24px; line-height: 1.5; color: #5B6475; }
  button { background: #0F1A3E; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>ProposalKit needs a connection to load your proposals. Your work is saved, so nothing is lost. Try again once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
